<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Bio Review · Chapter Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#0A0A0E;
    --surface:#17171F;
    --surface-2:#1E1E28;
    --ink:#F1EFE8;
    --muted:#8B8DA0;
    --spine:#2B3672;
    --spine-deep:#1B2350;
    --petal:#7186D6;
    --gold:#F2BB43;
    --crimson:#C6435E;
    --teal:#1FAAB6;
    --strong:#4FA876;
    --line:#2B2B36;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  *{box-sizing:border-box;}
  button{ outline:none; -webkit-tap-highlight-color:transparent; }
  button:focus{ outline:none; }
  .page-bg{
    position:fixed;
    inset:0;
    background-color:var(--bg);
    background-image: radial-gradient(ellipse at 50% 0%, rgba(43,54,114,0.35), transparent 60%);
    z-index:-1;
  }
  body{
    margin:0;
    min-height:100vh;
    background-color:var(--bg);
    background-image: radial-gradient(ellipse at 50% 0%, rgba(43,54,114,0.35), transparent 60%);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:6px;
  }
  .atom{
    width:44px;height:44px;position:relative;flex-shrink:0;
  }
  .atom .nucleus{
    position:absolute;top:50%;left:50%;width:10px;height:10px;
    background:var(--gold);border-radius:50%;
    box-shadow:0 0 8px rgba(242,187,67,0.6);
    transform:translate(-50%,-50%);
  }
  .atom .shell{
    position:absolute;top:50%;left:50%;
    border:1.5px solid var(--petal);border-radius:50%;
    transform:translate(-50%,-50%);
  }
  .atom .shell.s1{width:26px;height:26px;}
  .atom .shell.s2{width:42px;height:42px;border-color:var(--teal);}
  .atom .e{
    position:absolute;width:5px;height:5px;background:var(--gold);border-radius:50%;
    top:50%;left:50%;
    animation:orbit 4s linear infinite;
  }
  .atom .e.e2{animation-duration:6s;background:var(--crimson);}
  @keyframes orbit{
    from{transform:rotate(0deg) translateX(21px) rotate(0deg);}
    to{transform:rotate(360deg) translateX(21px) rotate(-360deg);}
  }
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:10px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:2px;
  }
  h1{
    font-family:'Playfair Display',Georgia,serif;
    font-size:24px;
    font-weight:700;
    letter-spacing:0.3px;
    margin:0;
    color:var(--ink);
  }
  .subtitle{
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:28px;
  }
  .stats{
    display:flex;
    gap:10px;
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    margin-bottom:18px;
  }
  .stat-pill{
    border:1px solid var(--line);
    border-radius:20px;
    padding:4px 12px;
  }
  .card{
    width:100%;
    max-width:520px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 22px 26px 34px;
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;
    left:0;top:0;bottom:0;width:12px;
    background:repeating-linear-gradient(
      180deg,
      var(--spine) 0px, var(--spine) 6px,
      var(--spine-deep) 6px, var(--spine-deep) 8px
    );
  }
  .concept-tag{
    display:inline-block;
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:var(--teal);
    background:rgba(31,170,182,0.12);
    border:1px solid rgba(31,170,182,0.3);
    border-radius:6px;
    padding:3px 9px;
    margin-bottom:14px;
    letter-spacing:0.3px;
  }
  .diagram-box{
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 10px;
    margin-bottom:16px;
  }
  .diagram-svg{
    width:100%;
    max-width:230px;
    height:auto;
  }
  .question{
    font-size:17px;
    line-height:1.55;
    margin-bottom:22px;
    color:var(--ink);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    text-align:left;
    border:1.5px solid var(--line);
    background:var(--surface-2);
    border-radius:10px;
    padding:13px 16px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    cursor:pointer;
    outline:none;
    -webkit-tap-highlight-color:transparent;
    transition:border-color 0.15s, background 0.15s;
  }
  .option:hover:not(:disabled){border-color:var(--petal);}
  .option:disabled{cursor:default;}
  .option.correct{border-color:var(--strong);background:rgba(79,168,118,0.14);}
  .option.wrong{border-color:var(--crimson);background:rgba(198,67,94,0.12);}
  .option .letter{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    color:var(--muted);
    margin-right:8px;
  }
  .explain{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:14px;
    line-height:1.6;
    color:#C9C7D8;
    display:none;
  }
  .explain.show{display:block;}
  .pages-ref{
    margin-top:10px;
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.3px;
  }
  .next-btn{
    margin-top:18px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--spine);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background 0.15s;
    display:none;
  }
  .next-btn:hover{background:var(--spine-deep);}
  .next-btn.show{display:block;}
  .empty-state{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:40px 20px;
  }
  .sync-note{
    margin-top:14px;
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:10px;
    color:#57596B;
    text-align:center;
  }

  /* ---------- Duolingo-style additions ---------- */
  .streak-badge{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:12px;
    font-weight:600;
    color:var(--gold);
    background:rgba(242,187,67,0.1);
    border:1px solid rgba(242,187,67,0.3);
    border-radius:20px;
    padding:5px 14px;
    margin-bottom:20px;
  }
  #app{ width:100%; max-width:520px; }
  .practice-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg, var(--teal), #14848E);
    color:#06262A;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(31,170,182,0.35);
    margin-bottom:8px;
  }
  .practice-btn:disabled{opacity:0.4; cursor:default; box-shadow:none;}
  .mastery-line{
    text-align:center;
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    margin-bottom:30px;
  }
  .chapter-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-bottom:10px;
  }
  .chapter-label{
    font-family:'Playfair Display',Georgia,serif;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    min-width:100px;
    text-align:center;
  }
  .chapter-arrow{
    width:32px;height:32px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
  }
  .chapter-arrow:disabled{
    opacity:0.25;
    cursor:default;
  }
  .path{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    position:relative;
    padding:10px 0 20px;
  }
  .path::before{
    content:'';
    position:absolute;
    top:20px; bottom:40px; left:50%;
    width:2px;
    background:repeating-linear-gradient(180deg, var(--line) 0 6px, transparent 6px 12px);
    transform:translateX(-50%);
    z-index:0;
  }
  .path-node{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    position:relative;
    z-index:1;
    margin-bottom:14px;
  }
  .path-node.left{ align-self:flex-start; margin-left:14%; }
  .path-node.right{ align-self:flex-end; margin-right:14%; }
  .node-ring{
    width:76px;height:76px;
    border-radius:50%;
    padding:4px;
    display:flex;align-items:center;justify-content:center;
    transition:background 0.3s;
  }
  .node-circle{
    width:68px;height:68px;
    border-radius:50%;
    border:3px solid var(--line);
    background:var(--surface);
    color:var(--muted);
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    transition:transform 0.15s;
  }
  .master-badge{
    position:absolute;
    top:-4px; right:-4px;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--gold);
    color:#3A2A05;
    font-size:12px;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--bg);
  }
  .node-circle:active{ transform:scale(0.94); }
  .node-circle.progress{
    border-color:var(--petal);
    color:var(--petal);
    background:var(--surface-2);
  }
  .node-circle.mastered{
    border-color:var(--gold);
    background:var(--gold);
    color:#3A2A05;
    box-shadow:0 0 0 4px rgba(242,187,67,0.15), 0 4px 14px rgba(242,187,67,0.3);
  }
  .node-title{
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    text-align:center;
  }
  .node-sub{
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:10px;
    color:var(--muted);
  }

  .quiz-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .exit-btn{
    width:32px;height:32px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--muted);
    font-size:14px;
    cursor:pointer;
    flex-shrink:0;
  }
  .progress-track{
    flex:1;
    height:10px;
    border-radius:6px;
    background:var(--surface-2);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:6px;
    background:linear-gradient(90deg, var(--teal), var(--gold));
    transition:width 0.35s ease;
  }
  .combo{
    min-width:38px;
    text-align:center;
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    color:var(--gold);
  }
  @keyframes pop{
    0%{transform:scale(1);}
    40%{transform:scale(1.04);}
    100%{transform:scale(1);}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
  }
  .option.correct{ animation:pop 0.3s ease; }
  .option.wrong{ animation:shake 0.3s ease; }

  .complete-card{
    width:100%;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:40px 26px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
  }
  .complete-icon{ font-size:46px; margin-bottom:10px; }
  .complete-card h2{
    font-family:'Playfair Display',Georgia,serif;
    margin:0 0 18px;
    font-size:20px;
  }
  .complete-stat{
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:14px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .complete-stat b{ color:var(--gold); }

  .transfer-link{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:var(--muted);
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:11px;
    text-align:center;
    padding:10px;
    cursor:pointer;
  }
  .transfer-code{
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    font-size:11px;
    color:var(--gold);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    margin:14px 0 10px;
    word-break:break-all;
  }
  .transfer-msg{
    font-size:11px;
    min-height:16px;
    margin-top:6px;
    color:var(--muted);
  }
  .transfer-divider{
    width:100%;
    height:1px;
    background:var(--line);
    margin:22px 0;
  }
  .transfer-input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    font-size:13px;
    font-family:'IBM Plex Mono','JetBrains Mono',monospace;
    margin:10px 0;
    box-sizing:border-box;
    text-align:center;
  }
</style>
</head>

  <div class="sync-note" id="syncNote">local mode</div>

    {

  // Same half-life regression model as sat-vocab: recallP(h,d) = 2^(-d/h)
  // h = half-life in days (learned per-question), d = days since last review.
  // weak threshold: recall probability < 80%
  const STORAGE_KEY = "bioreview_progress_v1";

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch { return {}; }
  }
  function saveProgress(progress) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    if (firebaseReady) {
      db.setDoc(db.doc(db.instance, PROGRESS_COLLECTION, getUid()), progress)
        .catch(e => console.warn("Firestore sync failed:", e));
    }
  }
  async function loadRemoteIfAvailable(local) {
    if (!firebaseReady) return local;
    try {
      const snap = await db.getDoc(db.doc(db.instance, PROGRESS_COLLECTION, getUid()));
      if (snap.exists()) return snap.data();
    } catch (e) { console.warn("Firestore load failed:", e); }
    return local;
  }

  function recallProb(halfLife, daysSince) {
    return Math.pow(2, -daysSince / halfLife);
  }
  function daysSince(ts) {
    return (Date.now() - ts) / (1000 * 60 * 60 * 24);
  }

  function getEntry(progress, id) {
    return progress[id] || { halfLife: 1, lastSeen: 0, seen: 0, lastCorrect: false };
  }
  function updateEntry(progress, id, correct) {
    const e = getEntry(progress, id);
    e.seen += 1;
    // correct answer -> half-life grows; wrong -> resets low
    e.halfLife = correct ? e.halfLife * (1.6 + Math.random() * 0.4) : Math.max(0.5, e.halfLife * 0.5);
    e.lastSeen = Date.now();
    e.lastCorrect = correct;
    progress[id] = e;
    return e;
  }

  function pickNextQuestion(progress) {
    const scored = QUESTIONS.map(q => {
      const e = getEntry(progress, q.id);
      const d = e.lastSeen ? daysSince(e.lastSeen) : 999;
      const p = e.seen ? recallProb(e.halfLife, d) : 0; // unseen = highest priority
      return { q, p };
    });
    scored.sort((a, b) => a.p - b.p); // lowest recall probability first
    return scored[0].q;
  }

  // ---------- UI state ----------
  let progress = loadProgress();
  let current = null;

  // ---------- Identity & leaderboard ----------
  const UID_KEY = "bioreview_uid";
  const NICK_KEY = "bioreview_nickname";
  const BEST_KEY = "bioreview_best_ever";

  function getUid() {
    let uid = localStorage.getItem(UID_KEY);
    if (!uid) { uid = "u_" + Math.random().toString(36).slice(2, 10); localStorage.setItem(UID_KEY, uid); }
    return uid;
  }
  function getNickname() { return localStorage.getItem(NICK_KEY); }
  function setNickname(name) { localStorage.setItem(NICK_KEY, name); }
  function loadBest() {
    try { return JSON.parse(localStorage.getItem(BEST_KEY)) || { bestStreak: 0, totalCorrect: 0 }; }
    catch { return { bestStreak: 0, totalCorrect: 0 }; }
  }
  function saveBest(b) { localStorage.setItem(BEST_KEY, JSON.stringify(b)); }

  let lastLeaderboardError = null;

  async function syncLeaderboard() {
    if (!firebaseReady) return;
    const nick = getNickname();
    if (!nick) return;
    const concepts = getConcepts();
    const masteredCount = concepts.reduce((sum, c) => sum + conceptStatus(c.questions).masteredCount, 0);
    const best = loadBest();
    try {
      await db.setDoc(db.doc(db.instance, LEADERBOARD_COLLECTION, getUid()), {
        name: nick,
        masteredCount,
        totalQuestions: QUESTIONS.length,
        bestStreak: best.bestStreak,
        totalCorrect: best.totalCorrect,
        updatedAt: Date.now()
      });
      lastLeaderboardError = null;
    } catch (e) {
      lastLeaderboardError = `write failed: ${e.code || e.message || e}`;
      console.warn("Leaderboard sync failed:", e);
    }
  }

  async function fetchLeaderboard() {
    if (!firebaseReady) return [];
    try {
      const q = db.query(
        db.collection(db.instance, LEADERBOARD_COLLECTION),
        db.orderBy("masteredCount", "desc"),
        db.limit(20)
      );
      const snap = await db.getDocs(q);
      const rows = [];
      snap.forEach(d => rows.push({ id: d.id, ...d.data() }));
      lastLeaderboardError = null;
      return rows;
    } catch (e) {
      lastLeaderboardError = `read failed: ${e.code || e.message || e}`;
      console.warn("Leaderboard fetch failed:", e);
      return [];
    }
  }

  // ---------- Daily streak ----------
  const STREAK_KEY = "bioreview_daily_streak";
  function loadStreak() {
    try { return JSON.parse(localStorage.getItem(STREAK_KEY)) || { count: 0, lastDate: null }; }
    catch { return { count: 0, lastDate: null }; }
  }
  function todayStr(d = new Date()) { return d.toISOString().slice(0, 10); }
  function bumpStreakIfNeeded() {
    const s = loadStreak();
    const today = todayStr();
    if (s.lastDate === today) return s;
    const y = new Date(); y.setDate(y.getDate() - 1);
    s.count = (s.lastDate === todayStr(y)) ? s.count + 1 : 1;
    s.lastDate = today;
    localStorage.setItem(STREAK_KEY, JSON.stringify(s));
    return s;
  }

  // ---------- Concept map helpers ----------
  function getConcepts(pool = QUESTIONS) {
    const order = [];
    const byId = {};
    pool.forEach(q => {
      if (!byId[q.concept]) { byId[q.concept] = { concept: q.concept, title: q.conceptTitle, questions: [] }; order.push(q.concept); }
      byId[q.concept].questions.push(q);
    });
    return order.map(c => byId[c]);
  }
  function getChapters() {
    const order = [];
    const byId = {};
    QUESTIONS.forEach(q => {
      if (!byId[q.chapter]) { byId[q.chapter] = { chapter: q.chapter, questions: [] }; order.push(q.chapter); }
      byId[q.chapter].questions.push(q);
    });
    return order.map(c => byId[c]);
  }
  const CHAPTER_KEY = "bioreview_current_chapter";
  function getCurrentChapter() {
    const chapters = getChapters().map(c => c.chapter);
    let stored = parseInt(localStorage.getItem(CHAPTER_KEY), 10);
    if (!chapters.includes(stored)) stored = chapters[chapters.length - 1];
    return stored;
  }
  function setCurrentChapter(ch) { localStorage.setItem(CHAPTER_KEY, String(ch)); }
  function strengthColor(pct) {
    // pct: 0 (all weak) -> 100 (all strong). Interpolates crimson -> strong-green.
    const from = [198, 67, 94];   // crimson
    const to = [79, 168, 118];    // strong green
    const t = Math.max(0, Math.min(1, pct / 100));
    const rgb = from.map((c, i) => Math.round(c + (to[i] - c) * t));
    return `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  }

  function conceptStatus(qs) {
    let seenCount = 0, masteredCount = 0, weakCount = 0;
    qs.forEach(q => {
      const e = getEntry(progress, q.id);
      if (e.seen) {
        seenCount++;
        const p = recallProb(e.halfLife, daysSince(e.lastSeen));
        if (e.lastCorrect && p >= 0.8) masteredCount++;
        else weakCount++;
      } else {
        weakCount++; // never seen counts as weak/due
      }
    });
    const total = qs.length;
    const state = (total > 0 && masteredCount === total) ? "mastered" : (seenCount > 0 ? "progress" : "new");
    return { state, seenCount, masteredCount, weakCount, total };
  }

  // ---------- Session state ----------
  const SESSION = { queue: [], index: 0, correct: 0, streak: 0, bestStreak: 0 };

  function buildQueue(conceptFilter) {
    const pool = conceptFilter ? QUESTIONS.filter(q => q.concept === conceptFilter) : QUESTIONS;
    const scored = pool.map(q => {
      const e = getEntry(progress, q.id);
      const d = e.lastSeen ? daysSince(e.lastSeen) : 999;
      const p = e.seen ? recallProb(e.halfLife, d) : 0;
      return { q, p };
    });
    scored.sort((a, b) => a.p - b.p);
    const len = conceptFilter ? scored.length : Math.min(8, scored.length);
    return scored.slice(0, len).map(s => s.q);
  }

  function startSession(conceptFilter) {
    SESSION.queue = buildQueue(conceptFilter);
    SESSION.index = 0;
    SESSION.correct = 0;
    SESSION.streak = 0;
    SESSION.bestStreak = 0;
    renderView("quiz");
  }

  // ---------- Views ----------
  function renderView(view) {
    if (view === "map") renderMap();
    else if (view === "quiz") renderQuiz();
    else if (view === "leaderboard") renderLeaderboard();
    else if (view === "transfer") renderTransfer();
    else renderComplete();
  }

    const app = document.getElementById("app");

  async function renderLeaderboard() {
    const app = document.getElementById("app");
    app.innerHTML = `<div class="card"><div class="question">Loading leaderboard…</div></div>`;

    if (!firebaseReady) {
      app.innerHTML = `
        <div class="card" style="text-align:center;">
          <div class="question">Leaderboard isn't connected yet.</div>
          <div class="explain show" style="border-top:none;padding-top:0;">This needs Firebase configured so everyone's progress can sync here.</div>
          <button class="next-btn show" id="lbBack">Back to map</button>
        </div>
      `;
      document.getElementById("lbBack").addEventListener("click", () => renderView("map"));
      return;
    }

    await syncLeaderboard();
    const rows = await fetchLeaderboard();
    const uid = getUid();
    let html = `<div class="card"><div class="concept-tag">🏆 Leaderboard</div>`;
    if (rows.length === 0) {
      html += lastLeaderboardError
        ? `<div class="explain show" style="border-top:none;padding-top:0;color:var(--crimson);">Sync error: ${lastLeaderboardError}</div>`
        : `<div class="explain show" style="border-top:none;padding-top:0;">No scores yet — be the first!</div>`;
    } else {
      rows.forEach((r, i) => {
        const isMe = r.id === uid;
        html += `

            <span>${r.masteredCount}/${r.totalQuestions}</span>
          </div>
        `;
      });
    }
    html += `<button class="next-btn show" id="lbBack" style="margin-top:18px;">Back to map</button></div>`;
    app.innerHTML = html;
    document.getElementById("lbBack").addEventListener("click", () => renderView("map"));
  }

  function renderTransfer() {
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="concept-tag">📱 Device Transfer</div>

        <div class="transfer-code" id="transferCode">${getUid()}</div>
        <button class="next-btn show" id="copyBtn">Copy Code</button>
        <div id="copyMsg" class="transfer-msg"></div>
        <div class="transfer-divider"></div>
        <div class="question" style="font-size:14px;">Restore progress from another device:</div>
        <input id="restoreInput" class="transfer-input" type="text" placeholder="Paste transfer code here">
        <button class="next-btn show" id="restoreBtn" style="background:var(--strong);">Restore</button>
        <div id="restoreMsg" class="transfer-msg"></div>
        <button class="next-btn show" id="transferBack" style="margin-top:20px;">Back to map</button>
      </div>
    `;
    document.getElementById("copyBtn").addEventListener("click", async () => {
      const msg = document.getElementById("copyMsg");
      try {
        await navigator.clipboard.writeText(getUid());
        msg.style.color = "var(--strong)";
        msg.textContent = "Copied!";
      } catch {
        msg.style.color = "var(--muted)";
        msg.textContent = "Couldn't copy automatically — select the code above and copy it manually.";
      }
    });
    document.getElementById("restoreBtn").addEventListener("click", async () => {
      const code = document.getElementById("restoreInput").value.trim();
      const msg = document.getElementById("restoreMsg");
      if (!code) return;
      if (!firebaseReady) { msg.style.color = "var(--crimson)"; msg.textContent = "Firebase isn't connected on this device."; return; }
      msg.style.color = "var(--muted)"; msg.textContent = "Restoring…";
      try {
        const snap = await db.getDoc(db.doc(db.instance, PROGRESS_COLLECTION, code));
        if (!snap.exists()) { msg.style.color = "var(--crimson)"; msg.textContent = "No progress found for that code."; return; }
        localStorage.setItem(UID_KEY, code);
        progress = snap.data();
        saveProgress(progress);
        msg.style.color = "var(--strong)"; msg.textContent = "Restored! Returning to map…";
        setTimeout(() => renderView("map"), 900);
      } catch (e) {
        msg.style.color = "var(--crimson)"; msg.textContent = "Restore failed: " + (e.code || e.message || e);
      }
    });
    document.getElementById("transferBack").addEventListener("click", () => renderView("map"));
  }

  function renderMap() {
    const streak = loadStreak();
    document.getElementById("streakBadge").textContent = `🔥 ${streak.count} day streak`;

    const allConcepts = getConcepts();
    const totalMastered = allConcepts.reduce((sum, c) => sum + conceptStatus(c.questions).masteredCount, 0);
    const totalWeak = allConcepts.reduce((sum, c) => sum + conceptStatus(c.questions).weakCount, 0);

    const chapters = getChapters();
    const currentChapter = getCurrentChapter();
    const chapterIndex = chapters.findIndex(c => c.chapter === currentChapter);
    const chapterQuestions = chapters[chapterIndex].questions;
    const concepts = getConcepts(chapterQuestions);

    let html = `
      <button class="practice-btn" id="practiceBtn">⚡ Practice weak spots (${totalWeak})</button>
      <button class="practice-btn" id="leaderboardBtn" style="background:linear-gradient(135deg, var(--gold), #C98F1F); color:#3A2A05;">🏆 Leaderboard</button>
      <div class="mastery-line">${totalMastered} / ${QUESTIONS.length} mastered</div>

      <div class="chapter-nav">
        <button class="chapter-arrow" id="chPrev" ${chapterIndex <= 0 ? "disabled" : ""}>‹</button>
        <div class="chapter-label">Chapter ${currentChapter}</div>
        <button class="chapter-arrow" id="chNext" ${chapterIndex >= chapters.length - 1 ? "disabled" : ""}>›</button>
      </div>

      <div class="path">
    `;
    concepts.forEach((c, i) => {
      const status = conceptStatus(c.questions);
      const side = i % 2 === 0 ? "left" : "right";
      const pctStrong = Math.round((status.total - status.weakCount) / status.total * 100);
      const ringColor = strengthColor(pctStrong);
      const badge = status.state === "mastered" ? `<span class="master-badge">★</span>` : "";
      html += `
        <div class="path-node ${side}">
          <div class="node-ring" style="background: conic-gradient(${ringColor} ${pctStrong}%, var(--line) 0);">
            <button class="node-circle ${status.state}" data-concept="${c.concept}">${c.concept}${badge}</button>
          </div>
          <div class="node-title">${c.title}</div>
          <div class="node-sub">${status.masteredCount}/${status.total} mastered</div>
        </div>
      `;
    });
    html += `</div>
      <button class="transfer-link" id="transferLink">📱 Device Transfer</button>
    `;

    const app = document.getElementById("app");
    app.innerHTML = html;
    document.getElementById("practiceBtn").addEventListener("click", () => startSession(null));
    document.getElementById("leaderboardBtn").addEventListener("click", () => renderView("leaderboard"));
    document.getElementById("transferLink").addEventListener("click", () => renderView("transfer"));
    document.getElementById("chPrev").addEventListener("click", () => {
      if (chapterIndex > 0) { setCurrentChapter(chapters[chapterIndex - 1].chapter); renderMap(); }
    });
    document.getElementById("chNext").addEventListener("click", () => {
      if (chapterIndex < chapters.length - 1) { setCurrentChapter(chapters[chapterIndex + 1].chapter); renderMap(); }
    });
    app.querySelectorAll(".node-circle").forEach(btn => {
      btn.addEventListener("click", () => startSession(btn.dataset.concept));
    });
  }

  function renderQuiz() {
    if (SESSION.index >= SESSION.queue.length) { renderView("complete"); return; }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    current = SESSION.queue[SESSION.index];
    const pct = Math.round((SESSION.index / SESSION.queue.length) * 100);

    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="quiz-header">
        <button class="exit-btn" id="exitBtn">✕</button>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="combo" id="combo">${SESSION.streak > 0 ? "🔥" + SESSION.streak : ""}</div>
      </div>
      <div class="card">
        <div class="concept-tag">Ch ${current.chapter} · Concept ${current.concept} — ${current.conceptTitle}</div>
        ${DIAGRAMS[current.id] ? `<div class="diagram-box">${DIAGRAMS[current.id]}</div>` : ""}
        <div class="question">${current.question}</div>
        <div class="options" id="options"></div>
        <div class="explain" id="explain">
          ${current.explanation}
          <div class="pages-ref">${current.citation || `Campbell Biology, p. ${current.page}`}</div>
        </div>
        <button class="next-btn" id="nextBtn">Next</button>
      </div>
    `;
    const optionsEl = document.getElementById("options");
    const letters = ["A", "B", "C", "D", "E"];
    current.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.innerHTML = `<span class="letter">${letters[i]}</span>${opt}`;
      btn.addEventListener("click", () => handleAnswer(i));
      optionsEl.appendChild(btn);
    });
    document.getElementById("exitBtn").addEventListener("click", () => renderView("map"));
  }

  function renderComplete() {
    const total = SESSION.queue.length;
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="complete-card">
        <div class="complete-icon">🏆</div>
        <h2>Session complete!</h2>
        <div class="complete-stat"><b>${SESSION.correct}</b> / ${total} correct</div>
        <div class="complete-stat">Best combo: 🔥 <b>${SESSION.bestStreak}</b></div>
        <button class="next-btn show" id="backBtn" style="margin-top:20px;">Back to map</button>
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", () => renderView("map"));
  }

  function handleAnswer(selectedIndex) {
    const optionsEl = document.getElementById("options");
    const buttons = optionsEl.querySelectorAll(".option");
    const correct = selectedIndex === current.correctIndex;

    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === current.correctIndex) btn.classList.add("correct");
      else if (i === selectedIndex) btn.classList.add("wrong");
    });

    updateEntry(progress, current.id, correct);
    saveProgress(progress);
    bumpStreakIfNeeded();

    SESSION.correct += correct ? 1 : 0;
    SESSION.streak = correct ? SESSION.streak + 1 : 0;
    SESSION.bestStreak = Math.max(SESSION.bestStreak, SESSION.streak);
    document.getElementById("combo").textContent = SESSION.streak > 0 ? "🔥" + SESSION.streak : "";

    const best = loadBest();
    best.totalCorrect += correct ? 1 : 0;
    best.bestStreak = Math.max(best.bestStreak, SESSION.streak);
    saveBest(best);
    syncLeaderboard();

    document.getElementById("explain").classList.add("show");
    document.getElementById("nextBtn").classList.add("show");
    document.getElementById("nextBtn").addEventListener("click", () => {
      SESSION.index++;
      renderView("quiz");
    });
  }

  // ---------- Boot ----------
  progress = await loadRemoteIfAvailable(progress);
  if (QUESTIONS.length === 0) {
    document.getElementById("app").innerHTML =
      `<div class="empty-state">No questions yet — add some to the QUESTIONS array.</div>`;
  } else if (!getNickname()) {
    renderNamePrompt();
  } else {
    renderView("map");
  }
</script>
</body>
</html>
